name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: didi
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: didi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U didi -d didi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://didi:local-ci-only@localhost:5432/didi_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools:install
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm verify:full
      - run: pnpm test:docker
      - name: Upload Docker verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-verification
          path: test-results/docker/**/verification.json
          retention-days: 14
          if-no-files-found: error
